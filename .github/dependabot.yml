version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # majors are planned as their own feature with a spec; security updates are not affected by this
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
